spring:
  application:
    name: digitalsign
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digitalsign}
    username: ${SPRING_DATASOURCE_USERNAME:digitalsign}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: ${SERVER_PORT:8080}

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
  admin:
    bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  rate-limit:
    login-per-minute: ${LOGIN_RATE_LIMIT_PER_MINUTE:10}
    verification-per-minute: ${VERIFICATION_RATE_LIMIT_PER_MINUTE:30}
    signing-per-minute: ${SIGNING_RATE_LIMIT_PER_MINUTE:10}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://digitalsign-roan.vercel.app}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
