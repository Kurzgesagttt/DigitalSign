spring:
  datasource:
    url: jdbc:h2:mem:digitalsign-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  base-url: http://localhost:5173
  jwt:
    secret: test-secret-for-jwt-signing-32-bytes-minimum
    expiration-seconds: 3600
  admin:
    bootstrap-email:

cors:
  allowed-origins: http://localhost:5173
