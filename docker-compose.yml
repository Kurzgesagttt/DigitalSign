services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: digitalsign
      POSTGRES_USER: digitalsign
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalsign -d digitalsign"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./DigitalSignature
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/digitalsign
      - SPRING_DATASOURCE_USERNAME=digitalsign
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD em .env}
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET em .env}
      - APP_BASE_URL=${APP_BASE_URL:-https://digitalsign.lucasmoreno.com.br}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://digitalsign.lucasmoreno.com.br}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    hostname: backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: ./DigitalSignatureFront
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      backend:
        condition: service_started
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
